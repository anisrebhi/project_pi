<div class="auth-screen">
  <div class="auth-card card card-pad">
    <span class="eyebrow">EventPass</span>
    <h1 class="mt-8">Connexion</h1>
    <p class="muted mt-8">Accédez à vos événements et réservations.</p>

    <div class="alert alert-error mt-16" *ngIf="serverError">{{ serverError }}</div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-24">
      <div class="field">
        <label for="email">Adresse email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          [class.invalid]="f['email'].invalid && f['email'].touched"
          placeholder="vous@exemple.com"
          autocomplete="email"
        />
        <span class="error-text" *ngIf="f['email'].touched && f['email'].errors?.['required']">
          L'email est requis.
        </span>
        <span class="error-text" *ngIf="f['email'].touched && f['email'].errors?.['email']">
          Veuillez saisir une adresse email valide.
        </span>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          [class.invalid]="f['password'].invalid && f['password'].touched"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <span class="error-text" *ngIf="f['password'].touched && f['password'].errors?.['required']">
          Le mot de passe est requis.
        </span>
        <span class="error-text" *ngIf="f['password'].touched && f['password'].errors?.['minlength']">
          Le mot de passe doit contenir au moins 6 caractères.
        </span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
        <span class="spinner" *ngIf="loading"></span>
        {{ loading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="text-sm muted mt-16" style="text-align: center;">
      Pas encore de compte ?
      <a routerLink="/register">Créer un compte</a>
    </p>
  </div>
</div>
