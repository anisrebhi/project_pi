<div class="confirm-overlay" *ngIf="dialog.active() as req" (click)="dialog.resolve(false)">
  <div class="confirm-box" (click)="$event.stopPropagation()">
    <div class="confirm-icon-wrap">
      <span class="material-icons confirm-icon" [class.confirm-icon-danger]="req.danger">
        {{ req.danger ? 'warning_amber' : 'help_outline' }}
      </span>
    </div>
    <h3>{{ req.title }}</h3>
    <p>{{ req.message }}</p>
    <div class="confirm-actions">
      <button class="btn btn-ghost" (click)="dialog.resolve(false)">
        {{ req.cancelLabel || 'Annuler' }}
      </button>
      <button
        class="btn"
        [class.btn-danger]="req.danger"
        [class.btn-primary]="!req.danger"
        (click)="dialog.resolve(true)"
      >
        {{ req.confirmLabel || 'Confirmer' }}
      </button>
    </div>
  </div>
</div>
