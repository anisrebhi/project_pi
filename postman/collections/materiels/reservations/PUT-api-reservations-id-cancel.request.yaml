$kind: http-request
name: 'PUT /api/reservations/:id/cancel'
url: '{{baseUrl}}/api/reservations/{{reservationId}}/cancel'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "cancellationReason": "Change of plans"
    }
order: 703
