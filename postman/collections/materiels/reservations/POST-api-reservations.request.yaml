$kind: http-request
name: 'POST /api/reservations'
url: '{{baseUrl}}/api/reservations'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "user": "{{userId}}",
      "event": "{{eventId}}",
      "numberOfTickets": 2
    }
order: 700
