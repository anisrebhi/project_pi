$kind: http-request
name: 'PUT /api/users/:id'
url: '{{baseUrl}}/api/users/{{userId}}'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "fullName": "Jane Smith Updated",
      "phone": "+21611223344"
    }
order: 303
