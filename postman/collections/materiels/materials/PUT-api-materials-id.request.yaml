$kind: http-request
name: 'PUT /api/materials/:id'
url: '{{baseUrl}}/api/materials/{{materialId}}'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "name": "Enceinte JBL EON615 - Updated",
      "description": "Enceinte active 15 pouces mise à jour",
      "quantity": 5,
      "status": "en-utilisation",
      "location": "Salle B - Étagère 1",
      "condition": "Bon état",
      "purchasePrice": 1100
    }
order: 104
