    {
      "name": "Projet Sono 2026",
      "description": "Gestion du matériel sonore pour les événements 2026",
      "startDate": "2026-01-01",
      "endDate": "2026-12-31",
      "status": "active",
      "budget": 50000
    }
order: 501
