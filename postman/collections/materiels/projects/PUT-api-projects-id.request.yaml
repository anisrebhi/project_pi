$kind: http-request
name: 'PUT /api/projects/:id'
url: '{{baseUrl}}/api/projects/{{projectId}}'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "name": "Projet Sono 2026 - Updated",
      "status": "completed",
      "budget": 55000
    }
order: 503
