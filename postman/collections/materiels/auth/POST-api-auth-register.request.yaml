$kind: http-request
name: 'POST /api/auth/register'
url: '{{baseUrl}}/api/auth/register'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "John Doe",
      "email": "john.doe@example.com",
      "password": "password123",
      "phone": "+21612345678"
    }
order: 200
