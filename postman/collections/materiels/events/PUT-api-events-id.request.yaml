$kind: http-request
name: 'PUT /api/events/:id'
url: '{{baseUrl}}/api/events/{{eventId}}'
method: PUT
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{token}}'
body:
  type: json
  content: |-
    {
      "title": "Tech Conference 2026 - Updated",
      "description": "Updated description",
      "capacity": 250,
      "status": "confirmed"
    }
order: 403
